name: ZZ Sink
on:
  workflow_run:
    workflows: ["ZZ Watchee"]
    types: [completed]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Probe
        run: |
          echo "event=${{ github.event_name }}"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "upstream_head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "upstream_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "upstream_event=${{ github.event.workflow_run.event }}"
          ls -a
          cat ZZ_ATTACKER_MARKER.txt 2>/dev/null || echo NO_MARKER
          ls test 2>/dev/null || echo NO_TEST_DIR
